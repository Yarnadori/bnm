name: Bug report
description: Report something that isn't working correctly
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include your bnm.json (or a minimal version of it) and the command you ran.
      placeholder: |
        1. Create bnm.json with ...
        2. Run `bnm dev`
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: bnm version
      description: Output of `bnm --version`
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / architecture
      placeholder: macOS 15 (arm64), Windows 11 (x64), Ubuntu 24.04 (amd64), ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste any relevant terminal output.
      render: shell
