name: Bug report
description: Report a reproducible problem in bnm.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include enough detail for someone else to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: bnm failed when...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal sequence of commands and files.
      placeholder: |
        1. Create this bnm.json...
        2. Run `bnm ...`
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include logs or terminal output if available.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: bnm version
      placeholder: "bnm version"
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant bnm.json
      description: Remove secrets before posting.
      render: json
    validations:
      required: false
